<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>麻雀 点数計算</title>
</head>
<body>
<main class="app">
  <header><h1>麻雀 点数計算</h1><button id="reset" class="ghost">リセット</button></header>

  <section class="card">
    <h2>面子構成</h2>
    <div class="grid">
      <label>暗刻（中張牌）<select id="ankoC"></select></label>
      <label>暗刻（么九牌）<select id="ankoY"></select></label>
      <label>明刻（中張牌）<select id="minkoC"></select></label>
      <label>明刻（么九牌）<select id="minkoY"></select></label>
      <label>暗槓（中張牌）<select id="ankanC"></select></label>
      <label>暗槓（么九牌）<select id="ankanY"></select></label>
      <label>明槓（中張牌）<select id="minkanC"></select></label>
      <label>明槓（么九牌）<select id="minkanY"></select></label>
    </div>
  </section>

  <section class="card">
    <h2>その他</h2>
    <div class="grid">
      <label>雀頭<select id="janto"><option>役牌以外</option><option>役牌</option></select></label>
      <label>待ち<select id="machi"><option>両面</option><option>辺張</option><option>嵌張</option><option>シャンポン</option><option>単騎</option></select></label>
      <label>上がり<select id="agari"><option>ツモ</option><option>ロン</option></select></label>
      <label>特殊上がり<select id="special"><option>なし</option><option>七対子</option><option>平和ツモ</option><option>門前ロン</option></select></label>
    </div>
  </section>

  <section class="card">
    <h2>飜数・親子</h2>
    <div class="hanrow"><button id="minus">−</button><strong id="han">2</strong><button id="plus">＋</button><span>飜</span></div>
    <div class="seg"><button data-parent="false" class="active">子</button><button data-parent="true">親</button></div>
  </section>

  <section class="card result">
    <div class="resultline"><span>面子構成</span><b id="mentsuFu">0符</b></div>
    <div class="resultline"><span>小計</span><b id="subtotal">20符</b></div>
    <div class="manual">
      <label><input type="checkbox" id="manualOn"> 符を手動入力</label>
      <input id="manualFu" type="number" min="0" step="1" placeholder="例：40" disabled>
    </div>
    <div class="big"><small>合計符</small><strong id="fu">20符</strong></div>
    <div class="big"><small>点数</small><strong id="score">−</strong></div>
    <div class="big secondary"><small>点数（青天井）</small><strong id="aoten">−</strong></div>
  </section>

  <p class="note">※Excelの「点数」計算式・「青天井」計算式を基準に移植。満貫以上は「満貫」表示。</p>
</main>
<script src="app.js"></script>
</body>
</html>
